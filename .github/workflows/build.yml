name: BuildAndTest

on:
  push:
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'Doxyfile'
      - 'asset/**'
      - 'LICENSE'
      - '.github/workflows/doc.yml'
  pull_request:
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'Doxyfile'
      - 'asset/**'
      - 'LICENSE'
      - '.github/workflows/doc.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported compilers (packages available on Ubuntu 22.04)
          - os: ubuntu-22.04
            type: Debug
            compiler: gcc-11
          - os: ubuntu-22.04
            type: Release
            compiler: gcc-11
            coverage: -DCMAKE_CXX_FLAGS=--coverage
          - os: ubuntu-22.04
            type: Debug
            compiler: clang-12
          - os: ubuntu-22.04
            type: Release
            compiler: clang-12

          # Ubuntu 24.04: newer GCC / Clang from distro packages
          - os: ubuntu-24.04
            type: Debug
            compiler: gcc-13
          - os: ubuntu-24.04
            type: Release
            compiler: gcc-13
          - os: ubuntu-24.04
            type: Debug
            compiler: gcc-14
          - os: ubuntu-24.04
            type: Release
            compiler: gcc-14
          - os: ubuntu-24.04
            type: Debug
            compiler: clang-14
          - os: ubuntu-24.04
            type: Release
            compiler: clang-14
          - os: ubuntu-24.04
            type: Debug
            compiler: clang-18
          - os: ubuntu-24.04
            type: Release
            compiler: clang-18

          # Windows / macOS
          - os: windows-2025
            type: Debug
          - os: windows-2025
            type: Release
          - os: macos-14
            type: Debug
          - os: macos-14
            type: Release

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: install compiler (Ubuntu)
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          set -euo pipefail
          sudo apt-get update

          case "${{ matrix.compiler }}" in
            gcc-11)
              sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
              sudo apt-get update
              sudo apt-get install -y g++-11
              echo "CC=gcc-11" >> "$GITHUB_ENV"
              echo "CXX=g++-11" >> "$GITHUB_ENV"
              sudo update-alternatives --install /usr/bin/gcov gcov /usr/bin/gcov-11 90
              ;;
            gcc-13)
              sudo apt-get install -y g++-13
              echo "CC=gcc-13" >> "$GITHUB_ENV"
              echo "CXX=g++-13" >> "$GITHUB_ENV"
              ;;
            gcc-14)
              sudo apt-get install -y g++-14
              echo "CC=gcc-14" >> "$GITHUB_ENV"
              echo "CXX=g++-14" >> "$GITHUB_ENV"
              ;;
            clang-12)
              sudo apt-get install -y clang-12
              echo "CC=clang-12" >> "$GITHUB_ENV"
              echo "CXX=clang++-12" >> "$GITHUB_ENV"
              ;;
            clang-14)
              sudo apt-get install -y clang-14
              echo "CC=clang-14" >> "$GITHUB_ENV"
              echo "CXX=clang++-14" >> "$GITHUB_ENV"
              ;;
            clang-18)
              sudo apt-get install -y clang-18
              echo "CC=clang-18" >> "$GITHUB_ENV"
              echo "CXX=clang++-18" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unknown compiler: ${{ matrix.compiler }}"
              exit 1
              ;;
          esac

      - name: enable compatibility test (linux)
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: echo "COMPATIBILITY=-DENABLE_COMPATIBILITY_TEST=ON" >> "$GITHUB_ENV"

      - name: install protobuf for compatibility test
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: install benchmark deps
        if: ${{ startsWith(matrix.os, 'ubuntu') && matrix.type == 'Release' }}
        run: |
          sudo apt-get install -y libbenchmark-dev
          echo "BENCHMARK=-DENABLE_BENCHMARK=ON" >> "$GITHUB_ENV"

      - name: install protobuf for compatibility test (mac)
        if: ${{ startsWith(matrix.os, 'macos') }}
        run: brew install protobuf

      - name: install benchmark deps (mac)
        if: ${{ startsWith(matrix.os, 'macos') && matrix.type == 'Release' }}
        run: brew install google-benchmark

      # - name: install protobuf for compatibility test (windows)
      #   if: ${{ startsWith(matrix.os, 'windows') }}
      #   run: |
      #     vcpkg install protobuf:x64-windows
      #     echo "COMPATIBILITY=-DENABLE_COMPATIBILITY_TEST=ON" >> $Env:GITHUB_ENV
      # - name: install benchmark deps (windows)
      #   if: ${{ startsWith(matrix.os, 'windows') && matrix.type == 'Release' }}
      #   run: |
      #     vcpkg install benchmark:x64-windows
      #     echo "BENCHMARK=-DENABLE_BENCHMARK=ON" >> $Env:GITHUB_ENV

      - name: install coverage tools
        if: ${{ matrix.coverage }}
        run: sudo apt-get install -y lcov

      - name: generate build script
        if: ${{ !startsWith(matrix.os, 'windows') }}
        run: cmake $BENCHMARK $COMPATIBILITY -DCMAKE_BUILD_TYPE=${{ matrix.type }} ${{ matrix.coverage }} .

      - name: generate build script
        if: ${{ startsWith(matrix.os, 'windows') }}
        run: cmake $Env:BENCHMARK $Env:COMPATIBILITY -DCMAKE_TOOLCHAIN_FILE="$Env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" -DCMAKE_BUILD_TYPE=${{ matrix.type }} ${{ matrix.coverage }} .

      - name: build project
        run: cmake --build . --config ${{ matrix.type }}

      - name: run unit testing
        run: ctest --output-on-failure -C ${{ matrix.type }}

      - name: run benchmark
        if: ${{ startsWith(matrix.os, 'ubuntu') && matrix.type == 'Release' }}
        run: ./test/benchmark/protopuf_benchmark

      # - name: run benchmark (windows)
      #   if: ${{ startsWith(matrix.os, 'windows') && matrix.type == 'Release' }}
      #   run: .\test\benchmark\Release\protopuf_benchmark

      - name: capture coverage
        if: ${{ matrix.coverage }}
        run: lcov --directory . --capture --output-file coverage.info

      - name: upload coverage
        if: ${{ matrix.coverage }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.info
